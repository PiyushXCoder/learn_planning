name: Deploy mdBook to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook + mdbook-mermaid
        run: |
          set -euo pipefail
          mdbook_ver=$(gh api repos/rust-lang/mdBook/releases/latest --jq .tag_name)
          mermaid_ver=$(gh api repos/badboy/mdbook-mermaid/releases/latest --jq .tag_name)
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${mdbook_ver}/mdbook-${mdbook_ver}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/${mermaid_ver}/mdbook-mermaid-${mermaid_ver}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          echo "$PWD" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build book
        run: |
          cd book
          mdbook build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
